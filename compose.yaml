services:

  processor_lear_cable:
    build:
      context: ./services/processor
    restart: unless-stopped
    environment:
      - SERVICE_ROOT=/data
      - INBOX_DIR=/data/inbox
      - PROCESSING_DIR=/data/processing
      - OUT_DIR=/data/out
      - PROCESSED_DIR=/data/processed
      - ERROR_DIR=/data/error

      - DONE_MARKER=${DONE_MARKER:-_DONE}
      - POLL_SECONDS=${POLL_SECONDS:-3}
      - BATCH_QUIET_SECONDS=${BATCH_QUIET_SECONDS}

      - EXTRACTOR_PATH=/app/extractor/extract_lear_fields.py

      - EMAIL_MODE=${EMAIL_MODE:-BATCH_ONLY}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_TO=${MAIL_TO:-}

    volumes:
      # IMPORTANT:
      # DATA_ROOT se parametriza por stack. Si haces pre/prod, pon DATA_ROOT distinto.
      - ${DATA_ROOT:-${STACK_ROOT:-/data/ias_prod}/data}:/data
      - ./apps/lear_cable/extractor:/app/extractor:ro


  api_lear_cable:
    build:
      context: ./services/api_lear_cable
    restart: unless-stopped

    # No exponemos el puerto en el host; nginx lo proxya dentro de la red docker
    environment:
      - INBOX_DIR=/data/inbox
      - PROCESSING_DIR=/data/processing
      - OUT_DIR=/data/out
      - PROCESSED_DIR=/data/processed
      - ERROR_DIR=/data/error
      - STATUS_DIR=/data/status
      - MAX_ZIP_MB=${MAX_ZIP_MB:-200}

    volumes:
      - ${DATA_ROOT:-${STACK_ROOT:-/data/ias_prod}/data}:/data


  tools_web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api_lear_cable

    ports:
      - "${TOOLS_WEB_PORT:-8081}:80"

    volumes:
      - ${WEB_SITE_DIR:-./services/web/site}:/usr/share/nginx/html:ro
      - ./services/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
