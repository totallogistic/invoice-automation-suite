version: '3.8'

services:
  
  unified_api:
    build:
      context: ./services/unified_api
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/config/tools.yaml
      - DATA_ROOT=${DATA_ROOT:-/data}
    volumes:
      - ${DATA_ROOT:-/data}:/data
      - ./config:/config:ro
      - ./libs/iasuite_common:/usr/local/lib/python3.12/site-packages/iasuite_common:ro
    ports:
      - "8000:8000"  # Exposed for testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  unified_processor:
    build:
      context: ./services/unified_processor
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/config/tools.yaml
      - DATA_ROOT=/data
      - POLL_SECONDS=${POLL_SECONDS:-3}
      - BATCH_QUIET_SECONDS=${BATCH_QUIET_SECONDS:-30}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO}
    volumes:
      - ${DATA_ROOT:-/data}:/data
      - ./config:/config:ro
      - ./apps:/apps:ro
      - ./libs/iasuite_common:/usr/local/lib/python3.12/site-packages/iasuite_common:ro
    depends_on:
      - unified_api


  tools_web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${TOOLS_WEB_PORT:-8081}:80"
    volumes:
      # Use WEB_SITE_DIR env var, defaults to site_dev for development
      - ./services/web/sites/dev:/usr/share/nginx/html:ro
      - ./services/web/nginx_unified.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - unified_api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =================================================================
# =================================================================
  # FORM SERVICES - Web-based form interfaces
  # =================================================================
  
  form_packing_list:
    build:
      context: ./services/form_server
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - ./apps/forms/packing_list:/schemas:ro
    command: python3 serve_packing_list.py
    environment:
      - TEXTUAL_DRIVER=web

  form_customs_clearance:
    build:
      context: ./services/form_server
    restart: unless-stopped
    ports:
      - "8101:8000"
    volumes:
      - ./apps/forms/customs_clearance:/schemas:ro
    command: python3 serve_customs_clearance.py
    environment:
      - TEXTUAL_DRIVER=web
