version: '3.8'

services:
  
  unified_api:
    build:
      context: ./services/unified_api
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/config/tools.yaml
      - DATA_ROOT=${DATA_ROOT:-/data}
      - BL_INBOX=/data/bl/inbox
      - BL_SYNC_SCRIPT=/opt/bl_sync.sh
    volumes:
      - ${DATA_ROOT:-/data}:/data
      - ./config:/config:ro
      - ./libs/iasuite_common:/usr/local/lib/python3.12/site-packages/iasuite_common:ro
      - ./apps:/app/apps:ro
      - /opt/bl_sync.sh:/opt/bl_sync.sh:ro
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - /home/mpino/.config/rclone:/root/.config/rclone

    ports:
      - "${UNIFIED_API_PORT:-8000}:8000"  
    healthcheck:
      # python3 está siempre disponible en python:3.12-slim, wget NO.
      # Hace GET a /health (endpoint que existe en main.py) y comprueba status=200.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  unified_processor:
    build:
      context: ./services/unified_processor
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/config/tools.yaml
      - DATA_ROOT=/data
      - POLL_SECONDS=${POLL_SECONDS:-1}
      - BATCH_QUIET_SECONDS=${BATCH_QUIET_SECONDS:-5}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO}
      - MAIL_TO_LEAR_CABLE=${MAIL_TO_LEAR_CABLE:-}
      - MAIL_TO_LEAR_TAC=${MAIL_TO_LEAR_TAC:-}
      - MAIL_TO_LEAR_KENITRA=${MAIL_TO_LEAR_KENITRA:-}
      - MAIL_TO_LEAR_RABAT=${MAIL_TO_LEAR_RABAT:-}
      - MAIL_TO_CUADRE_ASIENTOS=${MAIL_TO_CUADRE_ASIENTOS:-}
      - MAIL_TO_IMPORT_PARTIDA=${MAIL_TO_IMPORT_PARTIDA:-}
      - MAIL_TO_CROTON=${MAIL_TO_CROTON:-}
      - MAIL_TO_CAMION=${MAIL_TO_CAMION:-}
      - MAIL_TO_CROTON_IMPORT=${MAIL_TO_CROTON_IMPORT:-}
      - MAIL_TO_BL=${MAIL_TO_BL:-}
      - BL_PRINT_FOLDER=${BL_PRINT_FOLDER:-}
      - BL_CSV_DIR=/data/bl/csv
      - BL_DATA_ROOT=/data/bl
      - MAIL_TO_EXPORT_VISUAL=${MAIL_TO_EXPORT_VISUAL:-}
    volumes:
      - ${DATA_ROOT:-/data}:/data
      - ./config:/config:ro
      - ./apps:/apps:ro
      - ./libs/iasuite_common:/usr/local/lib/python3.12/site-packages/iasuite_common:ro
      - /mnt/canon-hotfolder:/mnt/canon-hotfolder

    depends_on:
      - unified_api


  tools_web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${TOOLS_WEB_PORT:-8081}:80"
    volumes:
      # Use WEB_SITE_DIR env var, defaults to site_dev for development
      - ./services/web/sites/${ENVIRONMENT:-dev}:/usr/share/nginx/html:ro
      - ./services/web/nginx_unified.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - unified_api
    healthcheck:
      # nginx:alpine usa BusyBox wget, que resuelve 'localhost' a IPv6 (::1) por
      # defecto. Como nginx solo bindea IPv4 (0.0.0.0:80), 'localhost' falla con
      # "Connection refused". Usar 127.0.0.1 explícitamente.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
