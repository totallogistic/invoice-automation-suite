<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[MLG] Revisión Vehículos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🚗 [MLG] Revisión de Vehículos</h1>
        <p class="description">Formulario de revisión - Delegación Málaga</p>
        <a href="/" class="back-link">← Volver al inicio</a>
    </header>

    <main>
        <form id="vehiculosForm" class="form-container">
            <div class="form-group">
                <label for="fecha">Fecha de Revisión *</label>
                <input type="date" id="fecha" name="fecha" required class="form-input">
            </div>

            <div class="form-group">
                <label for="responsable">Responsable *</label>
                <select id="responsable" name="responsable" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="ANTONIO RODRIGUEZ SANTANA">ANTONIO RODRIGUEZ SANTANA</option>
                    <option value="MANUEL RODRIGUEZ SANTANA">MANUEL RODRIGUEZ SANTANA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vehiculo">Vehículo *</label>
                <input type="text" id="vehiculo" name="vehiculo" value="JUMPER 5516 GDV" readonly class="form-input" style="background:#f0f0f0; cursor:default;">
            </div>

            <div class="form-group">
                <label for="kilometraje">Kilometraje Actual *</label>
                <input type="number" id="kilometraje" name="kilometraje" required class="form-input" min="0">
            </div>

            <h3>Revisión Técnica</h3>

            <div class="form-group">
                <label for="nivelAceite">Nivel de Aceite Correcto</label>
                <select id="nivelAceite" name="nivelAceite" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="✓">✓ Correcto</option>
                    <option value="X">X Necesita intervención</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nivelLiquidoFrenos">Nivel de Líquido de Frenos</label>
                <select id="nivelLiquidoFrenos" name="nivelLiquidoFrenos" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="✓">✓ Correcto</option>
                    <option value="X">X Necesita intervención</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nivelRefrigerante">Nivel de Refrigerante</label>
                <select id="nivelRefrigerante" name="nivelRefrigerante" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="✓">✓ Correcto</option>
                    <option value="X">X Necesita intervención</option>
                </select>
            </div>

            <div class="form-group">
                <label for="presionNeumaticos">Presión de Neumáticos</label>
                <select id="presionNeumaticos" name="presionNeumaticos" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="✓">✓ Correcto</option>
                    <option value="X">X Necesita intervención</option>
                </select>
            </div>

            <div class="form-group">
                <label for="lucesExteriores">Luces Exteriores Funcionando</label>
                <select id="lucesExteriores" name="lucesExteriores" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="✓">✓ Correcto</option>
                    <option value="X">X Necesita intervención</option>
                </select>
            </div>

            <div class="form-group">
                <label for="limpiaparabrisas">Limpiaparabrisas Funcionando</label>
                <select id="limpiaparabrisas" name="limpiaparabrisas" required class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="✓">✓ Correcto</option>
                    <option value="X">X Necesita intervención</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estadoCarroceria">Estado de Carrocería</label>
                <select id="estadoCarroceria" name="estadoCarroceria" class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="Excelente">Excelente</option>
                    <option value="Bueno">Bueno</option>
                    <option value="Regular">Regular</option>
                    <option value="Necesita reparación">Necesita reparación</option>
                </select>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones" rows="4" class="form-textarea" style="width:100%;"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">💾 Guardar Revisión</button>
        </form>

        <div id="message" style="display: none;"></div>
    </main>

    <script>
        document.getElementById('fecha').valueAsDate = new Date();
        
        document.getElementById('vehiculosForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            // Convert kilometraje to number
            if (data.kilometraje) {
                data.kilometraje = parseFloat(data.kilometraje);
            }
            
            try {
                const response = await fetch('/api/save-to-excel/revision-vehiculos-mlg', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    document.getElementById('message').textContent = '✅ Revisión guardada correctamente';
                    document.getElementById('message').className = 'success';
                    document.getElementById('message').style.display = 'block';
                    setTimeout(() => e.target.reset(), 2000);
                } else {
                    throw new Error('Error al guardar');
                }
            } catch (error) {
                document.getElementById('message').textContent = '❌ Error al guardar la revisión';
                document.getElementById('message').className = 'error';
                document.getElementById('message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
