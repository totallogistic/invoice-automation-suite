<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2563a8 0%, #1a4d7e 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(135deg, #2563a8 0%, #1a4d7e 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .form-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        .form-header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
            transition: background 0.3s;
        }
        
        .back-button:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .form-body {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        
        .form-group label .required {
            color: #dc3545;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2563a8;
            box-shadow: 0 0 0 3px rgba(37, 99, 168, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-top: 0.25rem;
        }
        
        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }
        
        .submit-button {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #2563a8 0%, #1a4d7e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 168, 0.3);
        }
        
        .submit-button:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <a href="/" class="back-button">← Volver al inicio</a>
            <h1>[MLG] {{ form.title }}</h1>
            <p>{{ form.description }}</p>
        </div>
        
        <div class="form-body">
            {% if success %}
            <div class="success-message">
                {{ form.success_message }}
            </div>
            {% endif %}
            
            <form method="POST" id="visitForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="fecha">Fecha <span class="required">*</span></label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                
                <div class="form-group">
                    <label for="hora_entrada">Hora de entrada <span class="required">*</span></label>
                    <input type="time" id="hora_entrada" name="hora_entrada" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="nombre">Nombre <span class="required">*</span></label>
                <input type="text" id="nombre" name="nombre" required autocomplete="off" list="nombre-suggestions">
                <datalist id="nombre-suggestions"></datalist>
            </div>
            
            <div class="form-group">
                <label for="apellidos">Apellidos <span class="required">*</span></label>
                <input type="text" id="apellidos" name="apellidos" required autocomplete="off" list="apellidos-suggestions">
                <datalist id="apellidos-suggestions"></datalist>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dni">DNI/NIE <span class="required">*</span></label>
                    <input type="text" id="dni" name="dni" required 
                           pattern="^[0-9]{8}[A-Z]$|^[XYZ][0-9]{7}[A-Z]$"
                           placeholder="12345678A o X1234567A"
                           autocomplete="off" list="dni-suggestions">
                    <datalist id="dni-suggestions"></datalist>
                    <div class="error-message" id="dni-error" style="display: none;">
                        Formato incorrecto. Use: 12345678A o X1234567A
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="empresa">Empresa <span class="required">*</span></label>
                    <input type="text" id="empresa" name="empresa" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="motivo">Motivo de la visita <span class="required">*</span></label>
                    <select id="motivo" name="motivo" required>
                        <option value="">Seleccione un motivo...</option>
                        <option value="Comercial">Comercial</option>
                        <option value="Cita previa">Cita previa</option>
                        <option value="Auditoría">Auditoría</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="persona_contacto">Persona de contacto <span class="required">*</span></label>
                    <select id="persona_contacto" name="persona_contacto" required>
                        <option value="">Seleccione...</option>
                        <option value="Rafael Rubiales Mejias">Rafael Rubiales Mejias</option>
                        <option value="Rubén Rubiales Montero">Rubén Rubiales Montero</option>
                        <option value="Palma Almagro Guerrero">Palma Almagro Guerrero</option>
                        <option value="José Luis Martínez Lázaro">José Luis Martínez Lázaro</option>
                        <option value="Javier Martínez Lázaro">Javier Martínez Lázaro</option>
                        <option value="Juan Antonio Martínez Lázaro">Juan Antonio Martínez Lázaro</option>
                        <option value="Gonzalo Baeza Torres">Gonzalo Baeza Torres</option>
                        <option value="Juan José López Martínez">Juan José López Martínez</option>
                        <option value="Mª José Gómez Carmona">Mª José Gómez Carmona</option>
                        <option value="Jose Luis del Pino Maya">Jose Luis del Pino Maya</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones" rows="3"></textarea>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="rgpd_consent" name="rgpd_consent" required>
                <label for="rgpd_consent">
                    He leído y acepto la <a href="/politica-privacidad" target="_blank">política de privacidad y tratamiento de datos personales</a> <span class="required">*</span>
                </label>
            </div>
            
            <button type="submit" class="submit-button">Registrar visita</button>
        </form>
        </div>
    </div>
    
    <script>
        // Set current date
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').value = today;
            
            // Set current time for hora_entrada
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('hora_entrada').value = `${hours}:${minutes}`;
            
            // Auto-focus on nombre field
            document.getElementById('nombre').focus();
            
            // DNI validation
            const dniInput = document.getElementById('dni');
            const dniError = document.getElementById('dni-error');
            
            dniInput.addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            
            dniInput.addEventListener('blur', function() {
                const pattern = /^[0-9]{8}[A-Z]$|^[XYZ][0-9]{7}[A-Z]$/;
                if (this.value && !pattern.test(this.value)) {
                    dniError.style.display = 'block';
                } else {
                    dniError.style.display = 'none';
                }
            });
            
            // Load autocomplete data
            loadAutocompleteData();
        });
        
        // Load autocomplete suggestions from server
        async function loadAutocompleteData() {
            try {
                const response = await fetch('/api/autocomplete/registro-visitas');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Populate datalists
                    if (data.nombres) {
                        const nombreList = document.getElementById('nombre-suggestions');
                        data.nombres.forEach(name => {
                            const option = document.createElement('option');
                            option.value = name;
                            nombreList.appendChild(option);
                        });
                    }
                    
                    if (data.apellidos) {
                        const apellidosList = document.getElementById('apellidos-suggestions');
                        data.apellidos.forEach(surname => {
                            const option = document.createElement('option');
                            option.value = surname;
                            apellidosList.appendChild(option);
                        });
                    }
                    
                    if (data.dnis) {
                        const dniList = document.getElementById('dni-suggestions');
                        data.dnis.forEach(dni => {
                            const option = document.createElement('option');
                            option.value = dni;
                            dniList.appendChild(option);
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading autocomplete data:', error);
            }
        }
        
        // Form validation before submit
        document.getElementById('visitForm').addEventListener('submit', function(e) {
            const dniInput = document.getElementById('dni');
            const pattern = /^[0-9]{8}[A-Z]$|^[XYZ][0-9]{7}[A-Z]$/;
            
            if (!pattern.test(dniInput.value)) {
                e.preventDefault();
                document.getElementById('dni-error').style.display = 'block';
                dniInput.focus();
                return false;
            }
        });
    </script>
</body>
</html>
