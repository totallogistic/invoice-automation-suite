<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ALG] Revisión de Estanterías</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2563a8 0%, #1a4d7e 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #2563a8 0%, #1a4d7e 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .form-section {
            padding: 2rem;
            border-bottom: 2px solid #e5e7eb;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563a8;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .checklist-section {
            padding: 2rem;
            background: #f8f9fa;
        }
        .checklist-section h2 {
            color: #1a4d7e;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .zone-row {
            background: white;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }
        .zone-row.selected {
            border-color: #2563a8;
            background: #f0f7ff;
        }
        .zone-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .zone-header input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .zone-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a4d7e;
        }
        .checks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .check-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .check-item .check-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #374151;
        }
        .check-item .radio-group {
            display: flex;
            gap: 1rem;
        }
        .check-item .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: normal;
            cursor: pointer;
        }
        .check-item .radio-group input[type="radio"] {
            width: auto;
            cursor: pointer;
        }
        .zone-obs {
            margin-top: 1rem;
        }
        .zone-obs label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.3rem;
        }
        .zone-obs textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.9rem;
            resize: vertical;
        }
        .submit-section {
            padding: 2rem;
            text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #2563a8 0%, #1a4d7e 100%);
            color: white;
            padding: 1.2rem 3rem;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
        }
        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Volver al inicio</a>
            <h1>📋 [ALG] Revisión de Estanterías - Trimestral</h1>
            <p>Delegación Algeciras</p>
        </header>

        <form id="estanteriasForm">
            <div class="form-section">
                <h2 style="color: #1a4d7e; margin-bottom: 1.5rem;">Datos Generales</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Fecha de Revisión *</label>
                        <input type="date" id="fechaRevision" required>
                    </div>
                    <div class="form-group">
                        <label>Responsable *</label>
                        <select id="responsable" required>
                            <option value="">Seleccionar...</option>
                            <option value="DIEGO LADRON FONCUBIERTA">DIEGO LADRON FONCUBIERTA</option>
                            <option value="DANIEL ALFARO DIAZ">DANIEL ALFARO DIAZ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nave *</label>
                        <select id="nave" required>
                            <option value="">Seleccionar...</option>
                            <option value="NAVE 1T25">NAVE 1T25</option>
                            <option value="NAVE 2T25">NAVE 2T25</option>
                            <option value="NAVE 3T25">NAVE 3T25</option>
                            <option value="NAVE 4T25">NAVE 4T25</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Trimestre *</label>
                        <select id="trimestre" required>
                            <option value="">Seleccionar...</option>
                            <option value="1ER TRIMESTRE">1ER TRIMESTRE</option>
                            <option value="2DO TRIMESTRE">2DO TRIMESTRE</option>
                            <option value="3ER TRIMESTRE">3ER TRIMESTRE</option>
                            <option value="4TO TRIMESTRE">4TO TRIMESTRE</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="checklist-section">
                <h2>Filas de Estanterías - Marcar las filas a revisar</h2>
                <p style="margin-bottom: 1.5rem; color: #666;">
                    Marca el checkbox de cada fila para incluirla en la revisión. Luego completa los checks de cada fila marcada.
                </p>

                <div id="zonasContainer">
                    <!-- Zonas generadas por JavaScript -->
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label>Observaciones Generales</label>
                    <textarea id="observacionesGenerales" rows="4" style="width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 6px;"></textarea>
                </div>
            </div>

            <div class="submit-section">
                <button type="submit" class="btn-submit">💾 Guardar Revisión</button>
                <div id="message" class="message"></div>
            </div>
        </form>
    </div>

    <script>
        const zonas = [
            ...Array.from({length: 10}, (_, i) => `FILA ${i + 1}`),
            'FONDO 1',
            'FONDO 2'
        ];

        const container = document.getElementById('zonasContainer');

        zonas.forEach(zona => {
            const div = document.createElement('div');
            div.className = 'zone-row';
            div.dataset.zone = zona;
            div.innerHTML = `
                <div class="zone-header">
                    <input type="checkbox" class="zone-checkbox" data-zone="${zona}">
                    <span class="zone-name">${zona}</span>
                </div>
                <div class="checks-grid">
                    <div class="check-item">
                        <span class="check-label">Colocación correcta</span>
                        <div class="radio-group">
                            <label><input type="radio" name="colocacion_${zona}" value="✓" class="check-colocacion" data-zone="${zona}"> ✓ OK</label>
                            <label><input type="radio" name="colocacion_${zona}" value="X" class="check-colocacion-nok" data-zone="${zona}"> ✗ NOK</label>
                        </div>
                    </div>
                    <div class="check-item">
                        <span class="check-label">Accesibilidad y señalización</span>
                        <div class="radio-group">
                            <label><input type="radio" name="accesibilidad_${zona}" value="✓" class="check-accesibilidad" data-zone="${zona}"> ✓ OK</label>
                            <label><input type="radio" name="accesibilidad_${zona}" value="X" class="check-accesibilidad-nok" data-zone="${zona}"> ✗ NOK</label>
                        </div>
                    </div>
                    <div class="check-item">
                        <span class="check-label">Sin corrosión en patas</span>
                        <div class="radio-group">
                            <label><input type="radio" name="corrosion_${zona}" value="✓" class="check-corrosion" data-zone="${zona}"> ✓ OK</label>
                            <label><input type="radio" name="corrosion_${zona}" value="X" class="check-corrosion-nok" data-zone="${zona}"> ✗ NOK</label>
                        </div>
                    </div>
                    <div class="check-item">
                        <span class="check-label">Anclajes al suelo correctos</span>
                        <div class="radio-group">
                            <label><input type="radio" name="anclajes_${zona}" value="✓" class="check-anclajes" data-zone="${zona}"> ✓ OK</label>
                            <label><input type="radio" name="anclajes_${zona}" value="X" class="check-anclajes-nok" data-zone="${zona}"> ✗ NOK</label>
                        </div>
                    </div>
                    <div class="check-item">
                        <span class="check-label">Protecciones contra golpes</span>
                        <div class="radio-group">
                            <label><input type="radio" name="protecciones_${zona}" value="✓" class="check-protecciones" data-zone="${zona}"> ✓ OK</label>
                            <label><input type="radio" name="protecciones_${zona}" value="X" class="check-protecciones-nok" data-zone="${zona}"> ✗ NOK</label>
                        </div>
                    </div>
                </div>
                <div class="zone-obs">
                    <label>Observaciones</label>
                    <textarea class="zone-obs-input" data-zone="${zona}" rows="2" placeholder="Observaciones para esta zona..."></textarea>
                </div>
            `;
            container.appendChild(div);
        });

        // Marcar zona automáticamente al hacer check
        document.querySelectorAll('.zone-checkbox').forEach(cb => {
            cb.addEventListener('change', function() {
                const zoneRow = this.closest('.zone-row');
                if (this.checked) {
                    zoneRow.classList.add('selected');
                } else {
                    zoneRow.classList.remove('selected');
                    zoneRow.querySelectorAll('input[type="radio"]').forEach(r => { r.checked = false; });
                    const obs = zoneRow.querySelector('.zone-obs-input');
                    if (obs) obs.value = '';
                }
            });
        });

        document.getElementById('estanteriasForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fechaRevision = document.getElementById('fechaRevision').value;
            const responsable = document.getElementById('responsable').value;
            const nave = document.getElementById('nave').value;
            const trimestre = document.getElementById('trimestre').value;
            const observacionesGenerales = document.getElementById('observacionesGenerales').value;

            if (!fechaRevision || !responsable || !nave || !trimestre) {
                const msg = document.getElementById('message');
                msg.textContent = 'Por favor completa todos los campos obligatorios';
                msg.className = 'message error';
                msg.style.display = 'block';
                return;
            }

            const filas = [];
            zonas.forEach(zona => {
                const checkbox = document.querySelector(`.zone-checkbox[data-zone="${zona}"]`);
                if (checkbox && checkbox.checked) {
                    const getRadio = (cls) => {
                        const checked = document.querySelector(`input[name="${cls}_${zona}"]:checked`);
                        return checked ? checked.value : '';
                    };
                    const obsInput = document.querySelector(`.zone-obs-input[data-zone="${zona}"]`);
                    filas.push({
                        fila: zona,
                        colocacion: getRadio('colocacion'),
                        accesibilidad: getRadio('accesibilidad'),
                        corrosion: getRadio('corrosion'),
                        anclajes: getRadio('anclajes'),
                        protecciones: getRadio('protecciones'),
                        observaciones: obsInput ? obsInput.value : ''
                    });
                }
            });

            if (filas.length === 0) {
                alert('Debe marcar al menos una fila para revisar');
                return;
            }

            const data = { fechaRevision, responsable, nave, trimestre, observacionesGenerales, filas };

            try {
                const response = await fetch('/api/save-estanterias-completo?sede=alg', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const messageDiv = document.getElementById('message');
                if (response.ok) {
                    messageDiv.textContent = `✅ Revisión guardada: ${filas.length} filas registradas`;
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    setTimeout(() => location.reload(), 2000);
                } else {
                    throw new Error('Error al guardar');
                }
            } catch (error) {
                const messageDiv = document.getElementById('message');
                messageDiv.textContent = '❌ Error al guardar la revisión';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            }
        });

        // Establecer fecha actual
        document.getElementById('fechaRevision').valueAsDate = new Date();
    </script>
</body>
</html>
