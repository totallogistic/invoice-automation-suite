<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Totallogistic Tools — Partida</title>
    <style>
      * { box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        padding: 32px 24px;
        max-width: 960px;
        margin: 0 auto;
        background: #f8f9fa;
        color: #212529;
        line-height: 1.6;
      }
      h1 { 
        font-size: 2rem;
        font-weight: 600;
        margin: 0 0 8px;
        color: #1a1a1a;
        letter-spacing: -0.02em;
      }
      p {
        margin: 8px 0;
      }
      .card { 
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
        margin: 24px 0;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      }
      .row { 
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      input[type="file"] { 
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: white;
        font-size: 0.95rem;
        cursor: pointer;
        transition: border-color 0.2s ease;
      }
      input[type="file"]:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      button { 
        padding: 10px 20px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 500;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      button:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      .muted { 
        color: #6b7280;
        font-size: 0.95rem;
      }
      .mono { 
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9rem;
        border: 1px solid #e5e7eb;
      }
      progress { 
        width: 100%;
        height: 24px;
        border-radius: 12px;
        overflow: hidden;
        background: #e5e7eb;
        border: none;
      }
      progress::-webkit-progress-bar {
        background: #e5e7eb;
        border-radius: 12px;
      }
      progress::-webkit-progress-value {
        background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
        border-radius: 12px;
        transition: width 0.3s ease;
      }
      progress::-moz-progress-bar {
        background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
        border-radius: 12px;
      }
      .kv { 
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 10px 16px;
        margin: 16px 0;
      }
      .badge { 
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: #f3f4f6;
        font-size: 0.85rem;
        font-weight: 500;
        border: 1px solid #e5e7eb;
      }
      .error { 
        color: #dc2626;
        font-weight: 500;
      }
      .ok { 
        color: #16a34a;
        font-weight: 500;
      }
      a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
      }
      a:hover {
        color: #1d4ed8;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Partida</h1>
    <p class="muted">Sube uno o varios archivos PDF, o un ZIP con múltiples PDFs. La página se queda aquí y muestra progreso/estado.</p>

    <div class="card">
      <div class="row">
        <input id="zip" type="file" accept=".pdf,.zip,application/pdf,application/zip" multiple />
        <button id="btnUpload">Subir Archivo(s)</button>
        <span id="uploadMsg" class="muted"></span>
      </div>
      <p class="muted" style="margin:10px 0 0">
        Endpoint: <span class="mono">POST /api/import_partida/batches</span>
      </p>
    </div>

    <div id="statusCard" class="card" style="display:none">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="muted">Batch</div>
          <div class="mono" id="batchId">—</div>
        </div>
        <div>
          <span class="badge" id="state">—</span>
          <span class="badge" id="stage">—</span>
        </div>
      </div>

      <div style="margin:12px 0">
        <progress id="bar" value="0" max="100"></progress>
        <div class="muted" id="pct" style="margin-top:6px">0%</div>
      </div>

      <div class="kv">
        <div class="muted">Mensaje</div> <div id="message">—</div>
        <div class="muted">Archivos</div> <div><span id="processed">0</span> / <span id="total">0</span></div>
        <div class="muted">Updated</div> <div class="mono" id="updated">—</div>
        <div class="muted">Recipients</div> <div id="recipients">—</div>
      </div>

      <div id="finalNote" style="margin-top:12px"></div>
    </div>

    <p><a href="/">Volver</a></p>

    <script>
      const $ = (id) => document.getElementById(id);

      let pollTimer = null;

      function setUploadMsg(text, isErr=false) {
        $("uploadMsg").textContent = text || "";
        $("uploadMsg").className = isErr ? "error" : "muted";
      }

      function showStatusCard(batchId) {
        $("statusCard").style.display = "block";
        $("batchId").textContent = batchId;
      }

      function stopPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
      }

      function computePercent(st) {
        // Si tienes processed_files/total_files real, usamos eso.
        const total = Number(st.total_files || 0);
        const done = Number(st.processed_files || 0);
        if (total > 0) return Math.min(100, Math.round((done / total) * 100));

        // Si no hay granularidad real (extractor batch), aproximamos por stage.
        const stage = (st.stage || "").toUpperCase();
        if (stage === "WAITING") return 5;
        if (stage === "EXTRACTING") return 55;
        if (stage === "EMAILING") return 85;
        if (stage === "DONE") return 100;
        if (stage === "ERROR") return 100;
        return 10;
      }

      async function fetchStatus(batchId) {
        const r = await fetch(`/api/import_partida/batches/${batchId}/status`, { cache: "no-store" });
        if (!r.ok) throw new Error(`Status HTTP ${r.status}`);
        return await r.json();
      }

      function renderStatus(st) {
        $("state").textContent = st.state || "—";
        $("stage").textContent = st.stage || "—";
        $("message").textContent = st.message || "—";
        $("total").textContent = st.total_files ?? 0;
        $("processed").textContent = st.processed_files ?? 0;
        $("updated").textContent = st.updated_at || "—";

        const rec = Array.isArray(st.recipients) ? st.recipients : [];
        $("recipients").textContent = rec.length ? rec.join(", ") : "—";

        const pct = computePercent(st);
        $("bar").value = pct;
        $("pct").textContent = `${pct}%`;

        const stage = (st.stage || "").toUpperCase();
        const state = (st.state || "").toUpperCase();

        let html = "";
        if (stage === "DONE" || state === "DONE") {
          html = `<div class="ok">Lote finalizado. Email enviado a: <span class="mono">${rec.join(", ") || "—"}</span></div>`;
          stopPolling();
        } else if (stage === "ERROR" || state === "ERROR") {
          html = `<div class="error">Lote en ERROR. Revisa logs y carpeta /data/error.</div>`;
          stopPolling();
        } else {
          html = `<div class="muted">Procesando… (polling cada 2s)</div>`;
        }
        $("finalNote").innerHTML = html;
      }

      async function startPolling(batchId) {
        stopPolling();
        const tick = async () => {
          try {
            const st = await fetchStatus(batchId);
            renderStatus(st);
          } catch (e) {
            $("finalNote").innerHTML = `<div class="error">No puedo leer status: ${e.message}</div>`;
          }
        };
        await tick();
        pollTimer = setInterval(tick, 2000);
      }

      $("btnUpload").addEventListener("click", async () => {
        const fileInput = $("zip");
        const selectedFiles = Array.from(fileInput.files);
        
        if (selectedFiles.length === 0) {
          return setUploadMsg("Selecciona uno o más archivos PDF, o un archivo ZIP.", true);
        }

        // Validate file types
        const validExtensions = ['.pdf', '.zip'];
        const hasZip = selectedFiles.some(f => f.name.toLowerCase().endsWith('.zip'));
        const hasPdf = selectedFiles.some(f => f.name.toLowerCase().endsWith('.pdf'));
        
        // If multiple files selected, none can be ZIP
        if (selectedFiles.length > 1 && hasZip) {
          return setUploadMsg("Cuando subes múltiples archivos, no puedes incluir ZIP. Sube solo PDFs o un único ZIP.", true);
        }
        
        // Validate all files have valid extensions
        for (const file of selectedFiles) {
          const fileName = file.name.toLowerCase();
          const isValid = validExtensions.some(ext => fileName.endsWith(ext));
          if (!isValid) {
            return setUploadMsg(`Archivo no permitido: ${file.name}. Solo se aceptan .pdf o .zip`, true);
          }
        }

        setUploadMsg("Subiendo…");
        $("statusCard").style.display = "none";
        $("finalNote").innerHTML = "";
        stopPolling();

        try {
          const fd = new FormData();
          // Append all selected files
          selectedFiles.forEach(file => {
            fd.append("files", file, file.name);
          });

          const r = await fetch("/api/import_partida/batches", { method: "POST", body: fd });
          if (!r.ok) {
            const t = await r.text();
            throw new Error(`Upload HTTP ${r.status}: ${t}`);
          }
          const data = await r.json();
          const batchId = data.batch_id;
          showStatusCard(batchId);
          setUploadMsg(`OK. Batch creado: ${batchId} con ${data.extracted_pdfs} PDF(s)`);
          await startPolling(batchId);
        } catch (e) {
          setUploadMsg(e.message, true);
        }
      });
    </script>
  </body>
</html>
