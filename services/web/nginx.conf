server {
  listen 80;
  client_max_body_size 1100m;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS resolver
  resolver 127.0.0.11 valid=30s;

  location / {
    try_files $uri $uri/ =404;
  }

  location /api/lear_cable/ {
    set $upstream_lear_cable api_lear_cable:8000;
    proxy_pass http://$upstream_lear_cable/api/lear_cable/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/import_partida/ {
    set $upstream_import_partida api_import_partida:8000;
    proxy_pass http://$upstream_import_partida/api/import_partida/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
# ---- Textual Serve behind subpath ----
  location ^~ /tools/json_form/ {
    set $upstream_tui_json_form tui_json_form:8000;
    proxy_http_version 1.1;

    # WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Disable compression for sub_filter to work
    proxy_set_header Accept-Encoding "";

    # long session
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # IMPORTANT: strip the /tools/json_form/ prefix when proxying
    rewrite ^/tools/json_form/(.*)$ /$1 break;

    proxy_pass http://$upstream_tui_json_form/;

    # Rewrite URLs in the response to use the correct base path
    sub_filter 'http://0.0.0.0:8000/' '/tools/json_form/';
    sub_filter 'ws://0.0.0.0:8000/' 'ws://$http_host/tools/json_form/';
    sub_filter_once off;
    sub_filter_types *;

    # If textual-serve sends redirects, fix them
    proxy_redirect http://0.0.0.0:8000/ /tools/json_form/;
    proxy_redirect http://$upstream_tui_json_form/ /tools/json_form/;
  }
}
