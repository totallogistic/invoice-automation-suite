server {
  listen 80;
  client_max_body_size 200m;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # API endpoints
  location /api/ {
    proxy_pass http://unified_api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
  }

  # Health check
  location /health {
    proxy_pass http://unified_api:8000/health;
    proxy_set_header Host $host;
  }

  # Form: Packing List (FIXED - trailing slashes strip the prefix)
  location /forms/packing_list/ {
    proxy_pass http://form_packing_list:8000/;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
  }

  # Form: Customs Clearance (FIXED - trailing slashes strip the prefix)
  location /forms/customs_clearance/ {
    proxy_pass http://form_customs_clearance:8000/;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
  }
}
