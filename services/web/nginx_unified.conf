server {
  listen 80;
  client_max_body_size 1100m;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # API endpoints - only proxy /api/
  location /api/ {
    proxy_pass http://unified_api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Health check endpoint
  location = /health {
    proxy_pass http://unified_api:8000/health;
  }

  # DON'T proxy /tools/ - let it serve static files!
  # The /tools/ directory contains the HTML pages
}
