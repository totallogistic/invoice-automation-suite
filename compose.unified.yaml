version: '3.8'

services:
  
  unified_api:
    build:
      context: ./services/unified_api
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/config/tools.yaml
      - DATA_ROOT=${DATA_ROOT:-/data}
    volumes:
      - ${DATA_ROOT:-/data}:/data
      - ./config:/config:ro
      - ./libs/iasuite_common:/usr/local/lib/python3.12/site-packages/iasuite_common:ro
    ports:
      - "8000:8000"  # Exposed for testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  unified_processor:
    build:
      context: ./services/unified_processor
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/config/tools.yaml
      - DATA_ROOT=/data
      - POLL_SECONDS=${POLL_SECONDS:-3}
      - BATCH_QUIET_SECONDS=${BATCH_QUIET_SECONDS:-30}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO}
    volumes:
      - ${DATA_ROOT:-/data}:/data
      - ./config:/config:ro
      - ./apps:/apps:ro
      - ./libs/iasuite_common:/usr/local/lib/python3.12/site-packages/iasuite_common:ro
    depends_on:
      - unified_api
