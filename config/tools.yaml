# Tool Configuration - Separate Inboxes, Shared Outputs

data_root: /data

tools:
  # Lear Cable
  - name: lear_cable
    enabled: true
    display_name: "Lear Cable Invoice Extractor"
    description: "Extracts data from Lear Cable invoices"
    
    extractor:
      type: python
      path: /apps/lear_cable/extractor/extract_lear_fields.py
    
    input:
      formats: [pdf]
      inbox: /data/lear_cable/inbox
    
    output:
      directory: /data/out
      artifacts:
        - invoices_extracted.xlsx
    
    email:
      subject_template: "[Lear Cable] Batch {batch_id} processed"

  # Import Partida
  - name: import_partida
    enabled: true
    display_name: "Import Partida Processor"
    description: "Processes import partida documents"
    
    extractor:
      type: python
      path: /apps/import_partida/extractor/wrapper.py
    
    input:
      formats: [pdf]
      inbox: /data/import_partida/inbox
    
    output:
      directory: /data/out
      artifacts:
        - import_partida.csv
    
    email:
      subject_template: "[Import Partida] Batch {batch_id} ready"

  # Lear Rabat
  - name: lear_rabat
    enabled: true
    display_name: "Lear Rabat DUA Processor"
    description: "Extracts DUA data from Lear Automotive Morocco invoices"
    
    extractor:
      type: python
      path: /apps/lear_rabat/extractor/extract_lear_rabat.py
    
    input:
      formats: [pdf]
      inbox: /data/lear_rabat/inbox
    
    output:
      directory: /data/out
      artifacts:
        - COMPLETADO_*.ods
    
    email:
      subject_template: "[Lear Rabat] Batch {batch_id} - DUA files ready"

# ─────────────────────────────────────────────────────────────────────────────
  # CROTON — Packing List ODS → Customs Summary ODS
  # ─────────────────────────────────────────────────────────────────────────────
  - name: croton
    display_name: "Croton — Packing List"
    description: |
      Procesa un fichero ODS de packing-list (Hoja5) de Croton/IFORTEX y genera
      un ODS resumen agrupado por partida aduanera (equivalente a Hoja4).
    extractor:
      path: /apps/croton/extractor/extract_croton.py
      args:
        - "{input_file}"
        - "{output_file}"
        - "--mapping"
        - "/apps/croton/extractor/product_mapping.csv"
    input:
      formats: [ods]
      sheet_name: "Hoja5"
      label: "Packing List Croton (ODS)"
    output:
      filename: "croton_resumen_{date}.ods"
      artifacts:
        - "croton_resumen_{date}.ods"
    email:
      subject: "Resumen partidas aduaneras — Croton {invoice_ref}"
      body: |
        Estimados,

        Adjunto encontraréis el resumen de partidas aduaneras generado
        automáticamente a partir del packing list recibido.

        Un saludo,
        Total Logistic
      recipients_from_config: true
      attach_output: true

  # Cuadre Asientos
  - name: cuadre_asientos
    enabled: true
    display_name: "Cuadre de Asientos Contables"
    description: "Procesa apuntes contables eliminando pares compensados"
    
    extractor:
      type: python
      path: /apps/cuadre_asientos/extractor/cuadre_asientos_wrapper.py
    
    input:
      formats: [xlsx, xls]
      inbox: /data/cuadre_asientos/inbox
    
    output:
      directory: /data/out
      artifacts:
        - "*_procesado_*.xlsx"
        - "*_reporte_*.txt"
    
    email:
      subject_template: "[Cuadre Asientos] Batch {batch_id} - Procesamiento completado"
