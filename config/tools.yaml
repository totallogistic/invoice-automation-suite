# Tool Configuration - Separate Inboxes, Shared Outputs

data_root: /data

tools:
  # Lear Cable
  - name: lear_cable
    enabled: true
    display_name: "Lear Cable Invoice Extractor"
    description: "Extracts data from Lear Cable invoices"

    extractor:
      type: python
      path: /apps/lear_cable/extractor/extract_lear_fields.py

    input:
      formats: [pdf]
      inbox: /data/lear_cable/inbox

    output:
      directory: /data/out
      artifacts:
        - invoices_extracted.xlsx

    email:
      subject_template: "[Lear Cable] Batch {batch_id} processed"

    status_dir: /data/lear_cable/status

  # Lear TAC
  - name: lear_tac
    enabled: true
    display_name: "Lear TAC Invoice Extractor"
    description: "Extracts data from Lear TAC (JLR MLA Wire Harnesses) invoices"

    extractor:
      type: python
      path: /apps/lear_tac/extractor/extract_lear_tac_fields.py

    input:
      formats: [pdf]
      inbox: /data/lear_tac/inbox

    output:
      directory: /data/out
      artifacts:
        - invoices_extracted.xlsx

    email:
      subject_template: "[Lear TAC] Batch {batch_id} processed"

    status_dir: /data/lear_tac/status

  # Lear Kenitra
  - name: lear_kenitra
    enabled: true
    display_name: "Lear Kenitra Invoice Extractor"
    description: "Extracts data from Lear Kenitra (DSxxxxxxx) invoices"

    extractor:
      type: python
      path: /apps/lear_kenitra/extractor/extract_lear_kenitra_fields.py

    input:
      formats: [pdf]
      inbox: /data/lear_kenitra/inbox

    output:
      directory: /data/out
      artifacts:
        - invoices_extracted.xlsx

    email:
      subject_template: "[Lear Kenitra] Batch {batch_id} processed"

    status_dir: /data/lear_kenitra/status

  # Import Partida
  - name: import_partida
    enabled: true
    display_name: "Import Partida Processor"
    description: "Processes import partida documents"

    extractor:
      type: python
      path: /apps/import_partida/extractor/wrapper.py

    input:
      formats: [pdf]
      inbox: /data/import_partida/inbox

    output:
      directory: /data/out
      artifacts:
        - import_partida.csv

    email:
      subject_template: "[Import Partida] Batch {batch_id} ready"

    status_dir: /data/import_partida/status

  # Lear Rabat
  - name: lear_rabat
    enabled: true
    display_name: "Lear Rabat DUA Processor"
    description: "Extracts DUA data from Lear Automotive Morocco invoices"

    extractor:
      type: python
      path: /apps/lear_rabat/extractor/extract_lear_rabat.py

    input:
      formats: [pdf]
      inbox: /data/lear_rabat/inbox

    output:
      directory: /data/out
      artifacts:
        - COMPLETADO_*.ods

    email:
      subject_template: "[Lear Rabat] Batch {batch_id} - DUA files ready"

    status_dir: /data/lear_rabat/status

  # Croton
  - name: croton
    enabled: true
    display_name: "Croton Resumen Partidas Aduaneras"
    description: >
      Genera el resumen de partidas aduaneras a partir del packing-list
      (.ods o .xlsx) y el mapeo de productos / factura (.ods, .xlsx o .xls).
      El resultado se añade como hoja "Resumen_Partidas" a una copia enriquecida
      del fichero de packing de entrada.

    input:
      formats: [ods, xlsx, xls]

    extractor:
      path: /apps/croton/extractor/extract_croton.py
      inject_mode: true

    output:
      directory: /data/out
      artifacts:
        - "CROTON_*.ods"
        - "CROTON_*.xlsx"
        - "CROTON_*.xls"
      filename_pattern: "CROTON_{stem}{ext}"

    email:
      subject_template: "[Croton] Batch {batch_id} - Resumen Partidas listo"

    status_dir: /data/croton/status

  # Cuadre Asientos
  - name: cuadre_asientos
    enabled: true
    display_name: "Cuadre de Asientos Contables"
    description: "Procesa apuntes contables eliminando pares compensados"

    extractor:
      type: python
      path: /apps/cuadre_asientos/extractor/cuadre_asientos_wrapper.py

    input:
      formats: [xlsx, xls]
      inbox: /data/cuadre_asientos/inbox

    output:
      directory: /data/out
      artifacts:
        - "*_procesado_*.xlsx"
        - "*_reporte_*.txt"

    email:
      subject_template: "[Cuadre Asientos] Batch {batch_id} - Procesamiento completado"

    status_dir: /data/cuadre_asientos/status

  # Camion Export Processor
  - name: camion
    enabled: true
    display_name: "Camion Export Processor"
    description: >
      Procesa el packing list de exportación de camiones integrando los datos
      extraídos de los documentos T1 (declaraciones de tránsito) y el documento
      de acompañamiento (DOC). Genera un XLSX enriquecido con la hoja
      Procesado_Camion.

    input:
      formats: [xlsx, pdf]
      inbox: /data/camion/inbox

    extractor:
      path: /apps/camion/extractor/run_processors.py
      camion_mode: true

    output:
      directory: /data/out
      artifacts:
        - "*-PROCESSED.xlsx"
        - "*-DAE_VISUAL.csv"

    email:
      subject_template: "[Camion] Batch {batch_id} - Packing list procesado"

    status_dir: /data/camion/status

  # Split Nóminas
  - name: split_nominas
    enabled: true
    display_name: "Split Nóminas"
    description: >
      Divide un PDF de nóminas multi-página en PDFs individuales por empleado.
      Detecta automáticamente empresa (TLS/TE), mes, año y nombre del empleado
      desde el texto del PDF y nombra cada archivo resultante en formato
      MMYY-APELLIDO_APELLIDO_NOMBRE-EMPRESA.pdf.
      El resultado se entrega como descarga directa de un ZIP desde el navegador.

    input:
      formats: [pdf]
      inbox: /data/split_nominas/inbox

    extractor:
      type: python
      path: /apps/split_nominas/extractor/split_nominas.py

    output:
      directory: /data/out
      artifacts:
        - "*.pdf"

    email:
      subject_template: ""

    status_dir: /data/split_nominas/status

  - name: split_cotizaciones
    enabled: true
    display_name: "Split Cotizaciones SS"
    description: >
      Divide PDFs de Recibos de Liquidación de Cotizaciones (RLC) y
      Relaciones Nominales de Trabajadores (RNT) en archivos individuales
      por empresa y tipo. Agrupa automáticamente las páginas multi-página
      del mismo documento. Nomenclatura: MMYY-RLC/RNT-EMPRESA[-CIUDAD].pdf.
      La entrega es descarga directa de un ZIP desde el navegador.

    input:
      formats: [pdf]
      inbox: /data/split_cotizaciones/inbox

    extractor:
      type: python
      path: /apps/split_cotizaciones/extractor/split_cotizaciones.py

    output:
      directory: /data/out
      artifacts:
        - "*.pdf"

    email:
      subject_template: ""

    status_dir: /data/split_cotizaciones/status

# Tool Configuration - Separate Inboxes, Shared Outputs

  - name: croton_import
    enabled: true
    display_name: "Croton Import"
    description: >
      Extrae datos de facturas IFORTEX (PDF imagen con OCR) y genera un Excel
      basado en plantilla con fórmulas activas. Rellena automáticamente OF, UN,
      precio, consumo y bultos. La columna BRUTO (amarillo) se completa a mano
      y el Resumen y Hoja6 se actualizan solos.

    input:
      formats: [pdf, xlsx]
      inbox: /data/croton_import/inbox

    extractor:
      path: /apps/croton_import/extractor/extract_croton_import.py
      croton_import_mode: true

    output:
      directory: /data/out
      artifacts:
        - "*_resultado.xlsx"

    email:
      subject_template: "[Croton Import] Batch {batch_id} - Factura procesada"

    status_dir: /data/croton_import/status

# BL - Conocimientos de Embarque

  - name: bl
    enabled: true
    display_name: "BL Extractor - Conocimientos de Embarque"
    description: >
      Extrae datos de Conocimientos de Embarque (BL) de las navieras
      AML, Balearia, DFDS, RFS y Trasmediterranea. Filtra automáticamente
      los documentos con destino ALGECIRAS y genera un CSV acumulativo
      bl_YYYYMMDD.csv en /data/bl/csv/.

    input:
      formats: [pdf]
      inbox: /data/bl/inbox

    extractor:
      type: python
      path: /apps/bl/extractor/extract_bl.py
      bl_mode: true

    output:
      directory: /data/bl/out
      artifacts:
        - "reporte_*.txt"

    email:
      subject_template: ""

    status_dir: /data/bl/status

    # ── Añadir este bloque al fichero config/tools.yaml existente ────────────────
# (dentro del array "tools:", al mismo nivel que los demás tools)

  - name: export_visual
    enabled: true
    display_name: "Export Visual — Partidas Dossier"
    description: >
      Convierte el fichero de partidas enviado por el cliente (CSV separado por ";")
      al formato CSV de importación de dossier de exportación de Visualtrans.
      Soporta múltiples clientes (ALDI, y futuros). Genera un fichero
      Convert_-_{nombre_entrada}.csv listo para cargar en el expediente de Visual.

    input:
      formats: [csv]
      inbox: /data/export_visual/inbox

    extractor:
      path: /apps/export_visual/extractor/export_visual.py
      export_visual_mode: true       # activa el handler específico en el processor

    output:
      directory: /data/out
      artifacts:
        - "Convert_-_*.csv"

    email:
      subject_template: "[Export Visual] Batch {batch_id} - CSV listo"

    status_dir: /data/export_visual/status

  # Intrastat — Generador CSV/TXT para AEAT
  - name: intrastat
    enabled: true
    display_name: "Intrastat — Generador CSV AEAT"
    description: >
      Convierte el archivo Excel exportado del programa "Visual" (una hoja, 8
      columnas del DUA) en el CSV plano separado por ";" que admite la AEAT.
      Replica byte a byte la lógica del modelo Excel del cliente (hojas
      "pegar archivo visual" y "intrastat archivo prueba").

    extractor:
      type: python
      path: /apps/intrastat/extractor/wrapper.py

    input:
      formats: [xlsx, ods, csv]
      inbox: /data/intrastat/inbox

    output:
      directory: /data/out
      artifacts:
        - "intrastat_*.csv"

    email:
      subject_template: "[Intrastat] Batch {batch_id} — CSV AEAT listo"

    status_dir: /data/intrastat/status

  # Carátula DHL — Navantia DDG51 Base Naval Rota
  - name: caratula_dhl
    enabled: true
    display_name: "Carátula DHL — Navantia DDG51"
    description: >
      Genera la carátula DHL para envíos del programa DDG51 Base Naval Rota.
      A partir de un lote de PDFs (factura TLS, cotización, albarán, seguro,
      certificado, invoice proveedor, packing list, labels, doc. Navantia),
      genera un Caratula_DHL_<claves>.pdf por cada factura con todos los
      documentos fusionados en el orden estándar de envío.

    extractor:
      type: python
      path: /apps/caratula_dhl/extractor/caratula_dhl.py

    input:
      formats: [pdf]
      inbox: /data/caratula_dhl/inbox

    output:
      directory: /data/out
      artifacts:
        - "Caratula_DHL_*.pdf"

    email:
      subject_template: "[Carátula DHL] Batch {batch_id} - Carátulas listas"

    status_dir: /data/caratula_dhl/status